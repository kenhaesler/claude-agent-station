# Local-dev compose for Claude Agent Station.
#
# - dashboard: FastAPI + built Svelte SPA on http://localhost:8420
# - agent:     Python orchestrator + Claude Code CLI (idle; exec to run)
#
# Auth is taken from the host:
#   ~/.claude    → Claude Code credentials  (read-write; CLI may refresh tokens)
#   ~/.config/gh → GitHub CLI auth          (read-only)
#
# State lives in named volumes so it survives `compose down`.

services:
  db:
    image: postgres:16-alpine
    container_name: cas-db
    environment:
      POSTGRES_USER: station
      POSTGRES_DB: station
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - station-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "station"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: claude-agent-station/dashboard:dev
    container_name: cas-dashboard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8420:8420"
    secrets:
      - db_password
    environment:
      STATION_HOST: "0.0.0.0"
      STATION_PORT: "8420"
      STATION_DB_PATH: /var/lib/claude-agent-station/station.db
      # ``${DB_PASSWORD}`` here is a Python-side placeholder, NOT a compose
      # shell-env interpolation (compose only substitutes env vars; the
      # ``$$`` escape preserves the literal ``$`` for app/config.py to
      # see). ``STATION_DB_PASSWORD_FILE`` points at the file-mounted
      # secret; ``resolved_db_url`` reads it at startup and replaces the
      # placeholder. Keeps the password out of process env.
      STATION_DB_URL: "postgresql+asyncpg://station:$${DB_PASSWORD}@db:5432/station"
      STATION_DB_PASSWORD_FILE: /run/secrets/db_password
      STATION_LOG_DIR: /var/log/claude-agent
      STATION_WORKSPACES: /var/lib/claude-agent-station/workspaces
      # Manager config JSON — source of truth for projects/permissions.
      # Lives on the named volume so dashboard and agent share it and it
      # survives container rebuilds. Default in app/config.py points at
      # /home/claude-agent/.claude/autonomous/ which is the bare-metal
      # systemd path and doesn't exist inside the dashboard container.
      STATION_CONFIG_PATH: /var/lib/claude-agent-station/manager-config.json
      STATION_DEPLOY_MODE: compose
      # Compose-mode run trigger — selected by STATION_DEPLOY_MODE=compose above.
      # /api/runs/trigger POSTs to this URL instead of calling systemctl, which
      # isn't available in the dashboard container.
      STATION_AGENT_LAUNCHER_URL: http://agent:8421
      # Required. Generate one with ``openssl rand -hex 32`` and put it in
      # ``.env`` at the repo root (compose auto-loads it) or export it before
      # ``docker compose up``. Compose will fail fast if it's missing — we no
      # longer ship a published default because it leaked into prod-shaped
      # stacks where it was never overridden.
      STATION_LAUNCHER_TOKEN: "${STATION_LAUNCHER_TOKEN:?STATION_LAUNCHER_TOKEN must be set (generate with: openssl rand -hex 32)}"
      # Optional auth — when set in .env, all /api/* (except /api/health and
      # /api/webhook/*) require a Bearer token, and /api/webhook/* requires
      # X-Webhook-Token. Empty string keeps the dashboard in backward-
      # compatible open mode. Both secrets must be propagated to the agent
      # service below so the plan-review gate's queue/webhook POSTs include
      # the right headers when auth is enabled.
      STATION_API_KEY: "${STATION_API_KEY:-}"
      STATION_WEBHOOK_SECRET: "${STATION_WEBHOOK_SECRET:-}"
      STATION_GITHUB_WEBHOOK_SECRET: "${STATION_GITHUB_WEBHOOK_SECRET:-}"
      STATION_SERVICE_USER: root
      # GitHub App credentials persist in the named volume so they survive
      # container rebuilds. The credentials file holds the App's RSA private
      # key and is chmod 0600 by the service module.
      STATION_GITHUB_APP_CREDENTIALS_PATH: /var/lib/claude-agent-station/github_app.json
      # PAT fallback. Same volume so the operator's saved token persists
      # across rebuilds. Used as override when the App flow isn't viable
      # (e.g. dashboard reachable only on localhost / private VM).
      STATION_GITHUB_PAT_PATH: /var/lib/claude-agent-station/github_pat.json
      # Third-party provider API keys (OpenAI Codex, Google Gemini). Same
      # named volume so bring-your-own-key configuration survives container
      # rebuilds. The file is chmod 0600 by the service module.
      STATION_PROVIDER_KEYS_PATH: /var/lib/claude-agent-station/provider_keys.json
      # Public-facing dashboard URL — used in the manifest's redirect_url and
      # setup_url so GitHub can find us after creating/installing the App.
      STATION_DASHBOARD_BASE_URL: http://localhost:8420
      # Path the OAuth router writes Claude credentials to. Points at the
      # same file the agent's CLI reads via the host mount below, so the
      # dashboard login actually authenticates the agent.
      STATION_CREDENTIALS_PATH: /root/.claude/.credentials.json
    networks:
      - default
      - agent-net
    volumes:
      - station-data:/var/lib/claude-agent-station
      - station-logs:/var/log/claude-agent
      # Share the host's Claude credentials with the dashboard so the
      # OAuth login writes to the same file the agent's CLI reads. Mounted
      # read-write because /api/oauth/refresh updates the token in place.
      - ${HOME}/.claude:/root/.claude:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8420/api/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: claude-agent-station/agent:dev
    container_name: cas-agent
    depends_on:
      dashboard:
        condition: service_healthy
      db:
        condition: service_healthy
    secrets:
      - db_password
    environment:
      STATION_DB_PATH: /var/lib/claude-agent-station/station.db
      # See dashboard service's STATION_DB_URL note: ``$${DB_PASSWORD}`` is a
      # Python-side placeholder substituted from the file-mounted secret
      # at startup, not a compose shell-env interpolation.
      STATION_DB_URL: "postgresql+asyncpg://station:$${DB_PASSWORD}@db:5432/station"
      STATION_DB_PASSWORD_FILE: /run/secrets/db_password
      STATION_LOG_DIR: /var/log/claude-agent
      STATION_WORKSPACES: /var/lib/claude-agent-station/workspaces
      # Same shared config the dashboard writes to, so the orchestrator
      # picks up newly-created projects on the next run.
      STATION_CONFIG: /var/lib/claude-agent-station/manager-config.json
      # Override the orchestrator's webhook URL so it reaches the dashboard
      # service by name on the compose network. Without this it falls back
      # to localhost, which inside the agent container is the agent itself.
      STATION_WEBHOOK_URL: http://dashboard:8420/api/webhook/run-event
      # The orchestrator and webhook_emitter ping the launcher's
      # /webhook-tick to bump _last_webhook_at so the zombie reaper sees
      # live progress. Inside the agent container the launcher is at
      # localhost — the dashboard's "agent" hostname is meaningless here.
      # Without this var set, the heartbeat ping was silently skipped
      # and the reaper killed every run > 120s (post-mortem of
      # run-20260512T122255Z / run-20260512T123216Z).
      STATION_AGENT_LAUNCHER_URL: http://localhost:8421
      # Shared secret authenticating dashboard → launcher calls. Both ends
      # read the same value from the environment / .env at the repo root.
      STATION_LAUNCHER_TOKEN: "${STATION_LAUNCHER_TOKEN:?STATION_LAUNCHER_TOKEN must be set (generate with: openssl rand -hex 32)}"
      # Optional auth — must match the dashboard's values. The plan-review
      # gate (``agent/plan_review_gate.py``) reads these to add a
      # ``Authorization: Bearer`` header on /api/queue and an
      # ``X-Webhook-Token`` header on /api/webhook/run-event. Empty strings
      # work as long as the dashboard is also in open mode; mismatch means
      # the gate's POSTs get 401'd silently.
      STATION_API_KEY: "${STATION_API_KEY:-}"
      STATION_WEBHOOK_SECRET: "${STATION_WEBHOOK_SECRET:-}"
      # Where the agent fetches a fresh GitHub App installation token before
      # spawning run-manager.sh. The token gets exported as GH_TOKEN so `gh`
      # CLI calls authenticate as the App installation. Different host than
      # the dashboard side because the agent reaches the dashboard via the
      # compose service name.
      STATION_DASHBOARD_BASE_URL: http://dashboard:8420
      # Claude Code CLI refuses ``--dangerously-skip-permissions`` under
      # root unless ``IS_SANDBOX=1`` is set. The agent container runs as
      # root and uses that flag for non-interactive ``claude --print``
      # calls in vision_analyst and run-manager.sh. Setting this here
      # documents the choice and unblocks those calls; tighten by running
      # the container as a non-root user instead, when feasible.
      IS_SANDBOX: "1"
      # Selects the launcher's spawn strategy:
      # - ``container`` (default): launcher spawns a fresh
      #   ``cas-runner-<run-id>`` container per run via the Docker socket
      #   mounted below. Provides resource isolation and clean teardown.
      # - ``inline``: legacy in-container subprocess (run-manager.sh under
      #   the launcher's process). Retained for one release as a rollback
      #   knob; remove once container mode is proven stable. See #386.
      STATION_RUNNER_MODE: container
    networks:
      - default
      - agent-net
    volumes:
      - station-data:/var/lib/claude-agent-station
      - station-logs:/var/log/claude-agent
      # Auth from the host. ``:z`` relabels for SELinux (Fedora/RHEL hosts
      # would otherwise fail with EPERM under enforcing mode).
      #
      # SECURITY: ``~/.claude`` is mounted read-write so the Claude CLI can
      # refresh OAuth tokens. A compromise of the agent process therefore
      # has write access to the host's Claude credentials, including those
      # of unrelated projects. For a hardened deployment, copy creds into
      # an isolated dir and bind that instead.
      - ${HOME}/.claude:/root/.claude:z
      - ${HOME}/.config/gh:/root/.config/gh:ro,z
      # Docker socket — required for STATION_RUNNER_MODE=container so the
      # launcher can spawn ephemeral cas-runner-<run-id> containers. The
      # socket grants root-equivalent host access; tighten by gating on a
      # Docker-in-Docker proxy if running on shared infra. See #386.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  # Dedicated bridge for dashboard ↔ agent ↔ runner-container traffic. The
  # ephemeral cas-runner-<run-id> containers spawned by the launcher join
  # this network so they can reach the dashboard at http://dashboard:8420
  # for webhook callbacks. ``default`` is kept so existing inter-service
  # DNS (db, dashboard, agent) keeps working unchanged. See #386.
  #
  # ``name: agent-net`` overrides compose's default project-prefixing
  # (would otherwise create ``claude-agent-station_agent-net``). The
  # runner spawn code in ``agent/runner_spawn.py`` joins by the bare
  # name, so the two must match. Discovered when the post-#386 stack
  # rebuild produced ``failed to set up container networking: network
  # agent-net not found`` on every triggered run.
  agent-net:
    name: agent-net
    driver: bridge
  default:

volumes:
  station-data:
  station-logs:
  station-pgdata:

secrets:
  db_password:
    file: ./.secrets/db_password
